name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn build

      - name: Install Hostinger CLI
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTINGER_CLI_VERSION: 4.20.1
        run: |
          dir="$RUNNER_TEMP/hostinger"
          gh release download "v$HOSTINGER_CLI_VERSION" --repo hostinger/api-cli --dir "$dir" \
            --pattern "hostinger-$HOSTINGER_CLI_VERSION-linux-amd64.tar.gz" \
            --pattern "hostinger-$HOSTINGER_CLI_VERSION-checksums.sha256"
          cd "$dir"
          sha256sum --check --ignore-missing "hostinger-$HOSTINGER_CLI_VERSION-checksums.sha256"
          tar -xzf "hostinger-$HOSTINGER_CLI_VERSION-linux-amd64.tar.gz" hostinger
          echo "$dir" >> "$GITHUB_PATH"

      - name: Deploy dist to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: hostinger up ./dist --domain sginfra.shop --type static --source upload --yes --format json
